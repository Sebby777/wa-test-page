<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
</head>
<body style="font-family: sans-serif; padding: 40px; text-align: center;">
    <h1>✅ 你正在WhatsApp内部浏览器中查看此页面</h1>
    <p>如果你看到了这个页面，说明H5链接已经成功在WhatsApp内打开了。</p>
    <p style="color: gray; font-size: 14px;">当前时间：<span id="time"></span></p>
    <script>
        document.getElementById('time').innerText = new Date().toLocaleString();
    </script>
</body>
</html>
